[package]
name = "heronite-watch-player"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Watch's player: mpv discovery, arguments and IPC supervision"

[dependencies]
heronite-watch-core = { path = "../watch-core" }
tempfile = "3"
anyhow.workspace = true
serde_json.workspace = true
url = { version = "2", features = ["serde"] }

# Starting mpv (`player::unix`) guards the helper through `heronite-data`; the
# types this crate also exposes compile everywhere.
[target.'cfg(unix)'.dependencies]
heronite-data = { path = "../data" }

[lints]
workspace = true
