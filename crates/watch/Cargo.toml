[package]
name = "heronite-watch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Watch: Stremio account, addon protocol, local streaming server and playback"

[dependencies]
heronite-watch-core = { path = "../watch-core" }
heronite-watch-addon = { path = "../watch-addon" }
heronite-watch-player = { path = "../watch-player" }
heronite-watch-stremio = { path = "../watch-stremio" }
heronite-watch-state = { path = "../watch-state" }
heronite-data = { path = "../data" }
anyhow.workspace = true
log.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
