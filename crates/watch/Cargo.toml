[package]
name = "heronite-watch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Watch: Stremio account, addon protocol, local streaming server and playback"

[dependencies]
heronite-data = { path = "../data" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
ureq = "3"
url = { version = "2", features = ["serde"] }
flate2 = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
