# System packages (.deb, .rpm, Arch .pkg.tar.zst) built by scripts/packages.sh
# from the release binaries (https://nfpm.goreleaser.com). The binaries are
# built on Ubuntu 22.04, so glibc 2.35 is the floor everywhere.
# scripts/packages.sh fills in ${VERSION}, ${BIN} (binaries folder) and
# ${MARKERS} (folder holding package-format-{deb,rpm,arch}, see
# Package::MARKER in crates/update).
name: hearthdeck-hero
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: games
priority: optional
maintainer: Vinicius <viniciuscr@users.noreply.github.com>
description: |-
  Fast native game launcher with a Stremio-backed Watch space.
  Every game you own in one Collection, and films and series in Watch:
  Continue watching, Top movies and Top series.
vendor: Hearthdeck
homepage: https://github.com/viniciuscr/hearthdeck-hero
license: GPL-3.0-only

contents:
  - src: ${BIN}/hearthdeck-hero
    dst: /usr/bin/hearthdeck-hero
    file_info: { mode: 0755 }
  # Found next to the main binary by the store login pages.
  - src: ${BIN}/hearthdeck-hero-epic-login
    dst: /usr/bin/hearthdeck-hero-epic-login
    file_info: { mode: 0755 }
  - src: packaging/linux/app.hearthdeck.Hero.desktop
    dst: /usr/share/applications/app.hearthdeck.Hero.desktop
  - src: packaging/linux/app.hearthdeck.Hero.png
    dst: /usr/share/icons/hicolor/256x256/apps/app.hearthdeck.Hero.png
  - src: packaging/linux/app.hearthdeck.Hero.metainfo.xml
    dst: /usr/share/metainfo/app.hearthdeck.Hero.metainfo.xml
  - src: LICENSE
    dst: /usr/share/doc/hearthdeck-hero/LICENSE
  - src: THIRD-PARTY-NOTICES.md
    dst: /usr/share/doc/hearthdeck-hero/THIRD-PARTY-NOTICES.md
  - src: licenses
    dst: /usr/share/doc/hearthdeck-hero/licenses
    type: tree
  - src: LICENSE
    dst: /usr/share/licenses/hearthdeck-hero/LICENSE
    packager: archlinux
  # Tells the app how it was installed, so updates go through the package
  # manager.
  - src: ${MARKERS}/package-format-deb
    dst: /usr/share/hearthdeck-hero/package-format
    packager: deb
  - src: ${MARKERS}/package-format-rpm
    dst: /usr/share/hearthdeck-hero/package-format
    packager: rpm
  - src: ${MARKERS}/package-format-arch
    dst: /usr/share/hearthdeck-hero/package-format
    packager: archlinux

# Linked: libudev, libxcb, libxkbcommon(-x11). Loaded at run time: Vulkan,
# Wayland, fontconfig. The Epic login window links WebKitGTK 4.1; without it
# the app offers the browser login, so it is only recommended.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libudev1
      - libxcb1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libvulkan1
      - libwayland-client0
      - libfontconfig1
    recommends:
      - libwebkit2gtk-4.1-0
      - mesa-vulkan-drivers | vulkan-icd
      - xdg-utils
      - pkexec | policykit-1
      - bubblewrap
  rpm:
    depends:
      - glibc >= 2.35
      - systemd-libs
      - libxcb
      - libxkbcommon
      - libxkbcommon-x11
      - vulkan-loader
      - libwayland-client
      - fontconfig
    recommends:
      - webkit2gtk4.1
      - mesa-vulkan-drivers
      - xdg-utils
      - polkit
      - bubblewrap
  archlinux:
    depends:
      - glibc
      - gcc-libs
      - systemd-libs
      - libxcb
      - libxkbcommon
      - libxkbcommon-x11
      - vulkan-icd-loader
      - wayland
      - fontconfig
    recommends:
      - "webkit2gtk-4.1: Epic Games login window"
      - "vulkan-driver: GPU rendering"
      - "xdg-utils: open links and folders"
      - "polkit: install updates from the app"
      - "bubblewrap: run games in the sandbox"

rpm:
  group: Amusements/Games
  compression: zstd
deb:
  compression: zstd
archlinux:
  packager: Vinicius <viniciuscr@users.noreply.github.com>
